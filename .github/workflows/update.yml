name: Update repository

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Both update workflows commit and push the same record file, so they must
# not run at the same time; on 2026-09-14 they raced and one lost its work.
concurrency:
  group: update-record
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '^3.11'

      - name: Set up environment
        run: |
          git config --global user.email "test@github.land"
          git config --global user.name "GitHub Almighty"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade tox

      - name: Run script
        id: scan
        # No space between `-e` and `run` or tox gets confused.
        # No retry wrapper: host failures are isolated in __main__, so a
        # whole-command retry only re-spends ~2000 GitHub requests inside
        # the same rate-limit hour, which is what exhausted it on Aug 29.
        run: tox -erun -- -l DEBUG --hosts GitHub,OSF
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.SEARCH_GITHUB_TOKEN }}

      - name: Push changes
        # The scan exits non-zero when a host failed but still commits the
        # hosts that succeeded, so this must not be gated on success().
        # Only runs if the scan itself ran; never during cancellation.
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: .github/tools/git_push_with_rebase

