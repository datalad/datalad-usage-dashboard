name: Update repository for GIN datasets

on:
  schedule:
    - cron: '0 12 * * 6'  # Only run on Saturday
  workflow_dispatch:

# Both update workflows commit and push the same record file, so they must
# not run at the same time; on 2026-09-14 they raced and one lost its work.
concurrency:
  group: update-record
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '^3.11'

      - name: Set up environment
        run: |
          git config --global user.email "test@github.land"
          git config --global user.name "GitHub Almighty"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade tox

      - name: Run script
        id: scan
        # No space between `-e` and `run` or tox gets confused
        run: tox -erun -- -l DEBUG --hosts GIN,hub.datalad.org,ATRIS
        timeout-minutes: 90
        env:
          GIN_TOKEN: ${{ secrets.GIN_TOKEN }}
          HUB_DATALAD_ORG_TOKEN: ${{ secrets.HUB_DATALAD_ORG_TOKEN }}

      - name: Push changes
        # See update.yml: a partial run commits and must still push.
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: |
          if [ "$(git rev-list --count --right-only @{upstream}...HEAD)" -eq 0 ]; then
            echo "No commits to push"
            exit 0
          fi
          # A scan runs for tens of minutes and master can move under it --
          # the sibling update workflow, dependabot, or a person.  A bare
          # push then throws the whole run away, so rebase onto the new tip
          # and retry.  Our commit only touches the record and the files
          # generated from it, so the rebase is conflict-free in practice.
          for attempt in 1 2 3; do
            if ! git pull --rebase; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase onto the updated master conflicted;" \
                   "leaving this run's commit unpushed" >&2
              exit 1
            fi
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying"
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1

